[project]
name = "dlofeel-state"
version = "0.1.0"
description = "Tactile + proprioceptive global shape estimation of deformable linear objects (DLOFeel-State)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "draccus>=0.11.0",
    "einops>=0.8.1",
    "gdown>=6.1.0",
    "h5py>=3.14.0",
    "ikpy>=4.0.0",
    "imageio>=2.37.2",
    "lightning>=2.6.1",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "opencv-python-headless>=4.12.0.88",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "pyvista>=0.46.4",
    "rich>=14.2.0",
    "rootutils>=1.0.7",
    "rosbags>=0.10.11",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.3",
    "torch>=2.10.0",
    "torchcurves>=0.2.1",
    "torchvision>=0.25.0",
    "tqdm>=4.67.1",
    "viser>=1.0.16",
    "wandb>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
